                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body ? JSON.stringify(body) : null
                });
                return r.json().catch(() => ({ ok: r.ok }));
            }
        };

        function setConn(state, text) {
            connOk = (state === true);
            const color = state === true ? 'bg-emerald-400' : (state === false ? 'bg-red-500' : 'bg-slate-500');
            E.dot.className = 'w-2 h-2 rounded-full inline-block ' + color;
            E.status.className = 'text-xs ' + (state === true ? 'text-emerald-400' : 'text-slate-400');
            E.status.textContent = text;
        }

        // 推荐组合：只在下拉文字后面挂个提示，**绝不改动你选的值**
        const RECOMMENDED = {
            sampler: {
                'dpmpp_3m_sde': '实测最干净 · 推荐',
                'dpmpp_2m_sde': '细节更锐 · 次选',
                'dpmpp_2m': '稳 · 工作流默认'
            },
            scheduler: {
                'karras': '通用 · 推荐',
                'sgm_uniform': '偏软 · 次选'
            }
        };

        // 下拉框是否还没填上（空，或只有那个占位项）
        function needsFill(select) {
            return !select.options.length ||
                   (select.options.length === 1 && select.options[0].value === '');
        }

        function fillSelect(select, values, preferred, recommended) {
            const prev = preferred || select.value;
            select.innerHTML = '';
            const list = values || [];
            if (!list.length) {
                // 占位提示：避免一片空白看不出状态（ComfyUI 就绪后 ping() 会自动补上）
                const o = document.createElement('option');
                o.value = '';
                o.textContent = '（ComfyUI 启动中…）';
                o.disabled = true;
                o.selected = true;
                select.appendChild(o);
                return;
            }
            list.forEach(v => {
                const o = document.createElement('option');
                o.value = v;
                const hint = recommended && recommended[v];
                o.textContent = hint ? (v + '  ★ ' + hint) : v;
                if (hint) o.title = hint;
                if (v === prev) o.selected = true;
                select.appendChild(o);
            });
            if (!list.includes(prev)) select.selectedIndex = 0;
        }

        function preferredModel() {
            return E.model.value || (defaults && defaults.model && defaults.model.value) || '';
        }

        // 启动中的状态栏摘要：把已经读到的工作流默认值显示出来（也是"绕过早退"的可见证据）
        function wfSummary() {
            const d = defaults || {};
            const s = d.sampler || {}, l = d.latent || {};
            const bits = [];
            if (s.steps != null) bits.push(s.steps + ' 步');
            if (s.cfg != null) bits.push('CFG ' + s.cfg);
            if (l.width && l.height) bits.push(l.width + '×' + l.height);
            if (s.sampler_name) bits.push(s.sampler_name);
            return bits.length ? bits.join(' / ') : '';
        }

        async function loadEnums() {
            try {
                const info = await api.get('/api/object_info/KSampler');
                const req = info.KSampler.input.required;
                const d = (defaults && defaults.sampler) || {};
                // 预选项优先取工作流里的值，消除「先填哪个」的顺序依赖
                const prefSampler = E.sampler.value || d.sampler_name || 'dpmpp_2m';
                const prefSched = E.scheduler.value || d.scheduler || 'karras';
                fillSelect(E.sampler, req.sampler_name[0], prefSampler, RECOMMENDED.sampler);
                fillSelect(E.scheduler, req.scheduler[0], prefSched, RECOMMENDED.scheduler);
            } catch (err) {
                // ComfyUI 还没起来：显示占位，交给 ping() 重试
                if (needsFill(E.sampler)) fillSelect(E.sampler, [], '', RECOMMENDED.sampler);
                if (needsFill(E.scheduler)) fillSelect(E.scheduler, [], '', RECOMMENDED.scheduler);
            }
        }

        async function loadWorkflow(force) {
            if (wfDefaultsApplied && !force) return;
            try {
                const wf = await api.get('/local/workflow');
                if (!wf.ok) return;
                const n = wf.nodes || {};
                defaults = n;
                if (n.model && n.model.value) {
                    if (Array.from(E.model.options).some(o => o.value === n.model.value)) {
                        E.model.value = n.model.value;
                    }
                }
                if (n.sampler) {
                    if (n.sampler.steps != null) E.steps.value = n.sampler.steps;
                    if (n.sampler.cfg != null) E.cfg.value = n.sampler.cfg;
                    if (n.sampler.sampler_name) E.sampler.value = n.sampler.sampler_name;
                    if (n.sampler.scheduler) E.scheduler.value = n.sampler.scheduler;
                }
                if (n.latent) {
                    if (n.latent.width) E.width.value = n.latent.width;
                    if (n.latent.height) E.height.value = n.latent.height;
                }
                if (n.negative && n.negative.text) E.negative.value = n.negative.text;
                if (n.positive && n.positive.base && !E.positive.value.trim()) {
                    E.positive.value = n.positive.base;
                }
                wfDefaultsApplied = true;    // 只应用一次，之后点「刷新」不会清掉你正在编辑的参数
            } catch (err) { /* 静默 */ }
        }

        async function refresh() {
            setConn(null, '正在检测…');
            // 工作流默认值与 ComfyUI 是否就绪无关（读的是本地 JSON 文件）—— 必须先加载，
            // 否则 ComfyUI 还在启动时打开页面，steps/cfg/宽高/负面词全都读不到。
            await loadWorkflow();
            try {
                const st = await api.get('/local/status');
                if (!st.comfy_up) {
                    const wf = wfSummary();
                    setConn(false, 'ComfyUI 正在启动…' + (wf ? ('　· 已读到工作流默认：' + wf) : '') + '　· 下拉框就绪后会自动填充');
                    if (needsFill(E.model)) fillSelect(E.model, [], '', null);
                    if (needsFill(E.sampler)) fillSelect(E.sampler, [], '', RECOMMENDED.sampler);
                    if (needsFill(E.scheduler)) fillSelect(E.scheduler, [], '', RECOMMENDED.scheduler);
                    return;
                }
                const gpu = ((st.system_stats || {}).devices || [])[0] || {};
                const gb = (v) => (v ? (v / 1073741824).toFixed(1) : null);
                const vram = gpu.vram_total ? (' · 显存 ' + gb(gpu.vram_free) + '/' + gb(gpu.vram_total) + ' GB') : '';
                setConn(true, 'ComfyUI 在线' + vram);
                fillSelect(E.model, st.checkpoints || [], preferredModel());
                await loadEnums();
            } catch (err) {
                setConn(false, '未连接到本地服务（请通过 启动.bat 打开页面）');
            }
        }
        /* ---------------- 连接状态（轻量轮询，不影响用户的参数） ---------------- */
        async function ping() {
            let st;
            try { st = await api.get('/local/status'); }
            catch (err) { setConn(false, '未连接到本地服务（请通过 启动.bat 打开页面）'); return; }
            if (!st.comfy_up) {
                const wf = wfSummary();
                setConn(false, 'ComfyUI 正在启动…' + (wf ? ('　· 已读到工作流默认：' + wf) : '') + '　· 下拉框就绪后会自动填充');
                if (needsFill(E.model)) fillSelect(E.model, [], '', null);
                return;
            }
            const gpu = ((st.system_stats || {}).devices || [])[0] || {};
            const gb = (v) => (v ? (v / 1073741824).toFixed(1) : null);
            const vram = gpu.vram_total ? (' · 显存 ' + gb(gpu.vram_free) + '/' + gb(gpu.vram_total) + ' GB') : '';
            setConn(true, 'ComfyUI 在线' + vram);
            if (needsFill(E.model)) {
                fillSelect(E.model, st.checkpoints || [], preferredModel());
            }
            // 首屏打开时 ComfyUI 通常还在启动，这里补上采样器/调度器（原来漏了，导致下拉框永远是空的）
            if (needsFill(E.sampler) || needsFill(E.scheduler)) {
                await loadEnums();
            }
        }

        /* ---------------- 提示词填充 ---------------- */
        function tagsFromBoard() {
            const chips = document.querySelectorAll('#selected-tags-container [data-en-tag]');
            const list = [];
            chips.forEach(c => {
                const t = (c.dataset.enTag || '').trim();
                if (t && list.indexOf(t) === -1) list.push(t);
            });
            return list.join(', ');
        }

        function fillPositive(text, emptyNote) {
            if (!text) { E.progressText.textContent = emptyNote || '没有可填入的内容'; return; }
            E.positive.value = text;
            const n = text.split(',').filter(s => s.trim()).length;
            E.progressText.textContent = '已填入 ' + n + ' 个标签';
        }

        /* ---------------- 结果画廊（含历史浏览 / 灯箱 / 打开文件夹） ---------------- */
        const galleryImages = [];     // 当前画廊中的图片，供灯箱 ← → 导航
        const ALL = '__all__';        // 「看整个流程」的虚拟批次
        let allRuns = [];
        let galleryLoaded = false;    // 画廊是否已经加载过（点过「刷新图片」或自己出过图）
        let gallerySyncing = false;   // 焦点同步防重入
        let currentSeries = null;
        let currentRunId = ALL;
        let lbIndex = -1;

        function reveal(relPath, runId) {
            const body = {};
            if (relPath) body.rel = relPath.replace(/^\/+/, '');
            if (runId) body.run_id = runId;
            api.post('/local/reveal', body).then(r => {
                E.progressText.textContent = r.ok ? '已在资源管理器中打开' : ('打开失败：' + (r.error || '未知原因'));
            }).catch(err => { E.progressText.textContent = '打开失败：' + err.message; });
        }

        function openLightbox(src) {
            const i = galleryImages.findIndex(g => g.src === src);
            lbIndex = i < 0 ? 0 : i;
            showLightbox();
        }

        function showLightbox() {
            const g = galleryImages[lbIndex];
            if (!g) return;
            E.lightboxImg.src = g.src;
            E.lightboxCap.textContent = (lbIndex + 1) + ' / ' + galleryImages.length + '　seed ' + g.seed;
            E.lightbox.classList.remove('hidden');
            E.lightbox.classList.add('flex');
        }

        function closeLightbox() {
            E.lightbox.classList.add('hidden');
            E.lightbox.classList.remove('flex');
            E.lightboxImg.removeAttribute('src');
        }

        function stepLightbox(d) {
            if (!galleryImages.length) return;
            lbIndex = (lbIndex + d + galleryImages.length) % galleryImages.length;
            showLightbox();
        }

        function galleryTool(icon, title, onClick) {
            const b = document.createElement('button');
            b.title = title;
            b.className = 'bg-black/60 text-white text-xs rounded px-1 py-0.5 hover:bg-black/80';
            b.innerHTML = '<i class="fa-solid ' + icon + '"></i>';
            b.addEventListener('click', e => { e.stopPropagation(); onClick(b); });
            return b;
        }

        // 两步确认：第一次点按钮变红、文字换成提示，3 秒内再点才真执行；超时自动复位
        function confirmThen(btn, label, onConfirm) {
            if (btn.dataset.armed === '1') {
                btn.dataset.armed = '';
                btn.classList.remove('bg-red-600');
                btn.innerHTML = btn.dataset.label || btn.innerHTML;
                onConfirm();
                return;
            }
            btn.dataset.armed = '1';
            btn.dataset.label = btn.innerHTML;
            btn.classList.add('bg-red-600');
            btn.innerHTML = label;
            setTimeout(() => {
                if (btn.dataset.armed !== '1') return;
                btn.dataset.armed = '';
                btn.classList.remove('bg-red-600');
                btn.innerHTML = btn.dataset.label;
            }, 3000);
        }

        // 服务端只接受裸文件名，而 it.files[0] 是 /_internal/output/<run>/<file> 形式
        function bareName(urlPath) {
            return String(urlPath || '').split('/').pop();
        }

        async function doDelete(runId, fileUrl, what) {
            if (!runId) { E.progressText.textContent = '当前没有可删除的批次'; return; }
            const body = fileUrl ? { run_id: runId, file: bareName(fileUrl) } : { run_id: runId };
            E.progressText.textContent = '正在删除…';
            let r;
            try { r = await api.post('/local/delete', body); }
            catch (err) { E.progressText.textContent = '删除失败：' + err.message; return; }
            if (!r.ok) { E.progressText.textContent = '删除失败：' + (r.error || '未知原因'); return; }
            E.progressText.textContent = what + '已删除（已移入回收站，可从回收站还原）';
            await loadHistory();
        }

        // ↻ 用这张图的参数回填表单（**不动提示词**）——「保留构图，只改提示词」的最常用动作
        function reuseParams(it) {
            const p = it.params || {};
            const s = p.sampler || {}, l = p.latent || {};
            if (it.seed != null) E.seed.value = it.seed;
            if (s.steps != null) E.steps.value = s.steps;
            if (s.cfg != null) E.cfg.value = s.cfg;
            if (s.sampler_name) E.sampler.value = s.sampler_name;
            if (s.scheduler) E.scheduler.value = s.scheduler;
            if (l.width) E.width.value = l.width;
            if (l.height) E.height.value = l.height;

            const m = (p.model && (p.model.ckpt_name || p.model.unet_name)) || null;
            let note = '';
            if (m) {
                if (Array.from(E.model.options).some(o => o.value === m)) {
                    E.model.value = m;
                } else {
                    note = '（模型 ' + m + ' 不在当前列表，未回填）';
                }
            }
            E.progressText.textContent = '已回填 seed ' + it.seed + ' 的参数' + note + '，改完提示词就能再出图';
            E.positive.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ↙ 把这一批的提示词载入输入框，便于在其基础上修改
        function loadRunPrompt(run) {
            if (!run) return;
            if (run.positive) E.positive.value = run.positive;
            if (run.negative) E.negative.value = run.negative;
            E.progressText.textContent = '已载入这一批的提示词，可在此基础上修改';
            E.positive.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 合并视图里不同批次的 index 会重名，所以用 uid 生成单元格 id
        const cellKey = (it) => String(it.uid || it.index).replace(/[^0-9a-zA-Z]/g, '_');

        // 已结束的批次里「没有图」的格子（图片被删掉 / 生成失败）不再占位：
        // 否则删图后画廊会留一个空荡荡的「等待中」格子，张数也会虚报。
        function galleryItems(run) {
            const items = (run && run.items) || [];
            if (!run || (run.status !== 'done' && run.status !== 'error')) return items;
            return items.filter(it => (it.files && it.files[0]) || (it.live && it.live[0]));
        }

        function renderGallery(run) {
            const items = galleryItems(run);
            if (!items.length) {
                E.gallery.dataset.sig = '';
                E.gallery.innerHTML = '<p class="text-xs text-slate-500 col-span-full">本次没有成功排队的任务。</p>';
                return;
            }
            // 用「批次号 + 格子清单」当签名：加图、删图都会让签名变化，从而立刻重建
            const sig = run.run_id + '|' + items.map(cellKey).join(',');
            if (E.gallery.dataset.sig !== sig) {
                E.gallery.dataset.sig = sig;
                E.gallery.innerHTML = '';
                galleryImages.length = 0;
                items.forEach(it => {
                    const cell = document.createElement('div');
                    cell.id = 'wb-cell-' + cellKey(it);
                    cell.className = 'relative rounded-md overflow-hidden bg-slate-900 border border-slate-700 aspect-[3/4] flex items-center justify-center';
                    cell.innerHTML = '<span class="text-xs text-slate-500">等待中</span>';
                    E.gallery.appendChild(cell);
                });
            }
            items.forEach(it => {
                const cell = $('wb-cell-' + cellKey(it));
                if (!cell) return;
                // 优先用已归档到 output/ 的路径（永久有效），否则退回 ComfyUI 实时通道
                const src = (it.files && it.files[0]) || (it.live && it.live[0]);
                if (!src || cell.dataset.src === src) return;
                cell.dataset.src = src;
                cell.innerHTML = '';
                const img = document.createElement('img');
                img.src = src;
                img.loading = 'lazy';
                img.className = 'w-full h-full object-cover cursor-zoom-in';
                img.addEventListener('click', () => openLightbox(src));
                cell.appendChild(img);
                galleryImages.push({ src: src, seed: it.seed });

                const caption = document.createElement('span');
                caption.className = 'absolute bottom-0 left-0 right-0 bg-black/60 text-white text-xs px-1 py-0.5 truncate';
                caption.textContent = (run.combined && it.at ? (fmtTime(it.at) + '　') : '') + 'seed ' + it.seed;
                cell.appendChild(caption);

                const link = document.createElement('a');
                link.href = src;
                link.target = '_blank';
                link.title = '新窗口打开原图';
                link.className = 'absolute top-1 right-1 bg-black/60 text-white text-xs rounded px-1 py-0.5 hover:bg-black/80';
                link.innerHTML = '<i class="fa-solid fa-up-right-from-square"></i>';
                link.addEventListener('click', e => e.stopPropagation());
                cell.appendChild(link);

                // 左上角一排小工具：打开文件夹 / 用这张参数重跑 / 载入提示词
                const tools = document.createElement('div');
                tools.className = 'absolute top-1 left-1 flex gap-1';
                cell.appendChild(tools);

                if (it.files && it.files[0]) {
                    tools.appendChild(galleryTool('fa-folder-open', '在资源管理器中选中这张图',
                        () => reveal(it.files[0])));
                    tools.appendChild(galleryTool('fa-trash-can', '删除这张图（送回收站，可从回收站还原）',
                        (b) => confirmThen(b, '确认？', () => doDelete(it.run_id || run.run_id, it.files[0], '这张图'))));
                }
                if (it.params) {
                    tools.appendChild(galleryTool('fa-rotate-right', '用这张的参数（seed / 步数 / CFG / 尺寸 / 采样器）重跑',
                        () => reuseParams(it)));
                }
                tools.appendChild(galleryTool('fa-arrow-down-long', '把这张所在批次的提示词载入输入框',
                    () => loadRunPrompt(runById(it.run_id) || run)));
            });
        }
        function fmtTime(iso) {
            return iso ? iso.replace('T', ' ').slice(5, 16) : '';
        }

        /* ---- 系列：同一流程的图收在一个文件夹里，一眼看出改了哪里、哪里变好 ---- */
        function seriesOf(r) { return r.series || '未归类'; }

        function seriesNames() {
            const seen = [];
            allRuns.forEach(r => { const n = seriesOf(r); if (seen.indexOf(n) === -1) seen.push(n); });
            return seen;                       // allRuns 已按时间倒序，系列也是新的在前
        }

        function runsOfSeries(name) { return allRuns.filter(r => seriesOf(r) === name); }

        function runById(id) { return allRuns.filter(r => r.run_id === id)[0] || null; }

        function countImages(rs) {
            return rs.reduce((s, r) => s + galleryItems(r).length, 0);
        }

        function currentSeriesDir() {
            const rs = runsOfSeries(currentSeries);
            return rs.length ? rs[0].series_dir : null;
        }

        function chipButton(text, title, active, onClick) {
            const b = document.createElement('button');
            b.className = 'h-6 px-2 text-xs rounded-md transition-colors duration-200 ' +
                (active ? 'bg-sky-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600');
            b.textContent = text;
            b.title = title;
            b.addEventListener('click', onClick);
            return b;
        }

        // 当前要显示什么：选中某一批 → 就那一批；选中「全部」→ 本系列所有图按时间正序拼起来，
        // 这样翻一遍就能看出这一路是怎么改好的
        function currentView() {
            const rs = runsOfSeries(currentSeries);
            if (currentRunId && currentRunId !== ALL) {
                const one = rs.filter(r => r.run_id === currentRunId)[0];
                if (one) return one;
                currentRunId = ALL;
            }
            const asc = rs.slice().sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
            const items = [];
            asc.forEach(r => galleryItems(r).forEach(it => {
                items.push(Object.assign({}, it, { uid: r.run_id + '#' + it.index, run_id: r.run_id, at: r.created }));
            }));
            return { run_id: ALL, series: currentSeries, combined: true, items: items,
                     created: asc.length ? asc[asc.length - 1].created : null };
        }

        function renderSeriesbar() {
            E.seriesbar.innerHTML = '';
            const names = seriesNames();
            if (names.length < 2) return;      // 只有一个系列时不占地方
            names.forEach(n => {
                const rs = runsOfSeries(n);
                E.seriesbar.appendChild(chipButton(
                    n + ' · ' + rs.length + '批/' + countImages(rs) + '张',
                    '系列：' + n + '\n同一流程的图都收在 _internal/output/' + n + '/',
                    currentSeries === n,
                    () => {
                        currentSeries = n;
                        currentRunId = ALL;
                        renderSeriesbar(); renderRunbar(); renderGallery(currentView());
                    }));
            });
        }

        function renderRunbar() {
            E.runbar.innerHTML = '';
            const rs = runsOfSeries(currentSeries);
            if (!rs.length) return;
            E.runbar.appendChild(chipButton(
                '全部 · ' + countImages(rs) + '张',
                '按时间正序看这个系列的全部图 —— 一眼看出改了哪里、哪里变好了',
                currentRunId === ALL,
                () => { currentRunId = ALL; renderRunbar(); renderGallery(currentView()); }));
            rs.forEach(r => {
                E.runbar.appendChild(chipButton(
                    fmtTime(r.created) + ' · ' + galleryItems(r).length + '张',
                    r.run_id + (r.positive ? ('\n' + r.positive) : ''),
                    currentRunId === r.run_id,
                    () => { currentRunId = r.run_id; renderRunbar(); renderGallery(r); }));
            });
        }

        /* 拉取 _internal/output/ 的全部历史并重建画廊。
           只在三种情况下被调用：点「刷新图片」、删图之后、自己出图完成之后。
           打开页面时不再自动调用 —— 免得命令行练的图自己跑到页面上。 */
        async function loadHistory(selectRun) {
            let d;
            try { d = await api.get('/local/runs'); } catch (err) { return; }
            allRuns = d.runs || [];
            galleryLoaded = true;

            const names = seriesNames();
            if (!names.length) {
                currentSeries = null;
                E.seriesbar.innerHTML = '';
                E.runbar.innerHTML = '';
                E.gallery.dataset.sig = '';
                E.gallery.innerHTML = '<p class="text-xs text-slate-500 col-span-full">还没有出过图。</p>';
                E.galleryInfo.textContent = '尚无历史';
                return;
            }
            if (names.indexOf(currentSeries) === -1) currentSeries = names[0];
            if (selectRun) {
                const r = runById(selectRun);
                if (r) currentSeries = seriesOf(r);      // 新出的图可能落在别的系列，跟着切过去
                currentRunId = selectRun;
            }
            const rs = runsOfSeries(currentSeries);
            if (currentRunId !== ALL && !rs.some(r => r.run_id === currentRunId)) currentRunId = ALL;

            renderSeriesbar();
            renderRunbar();
            renderGallery(currentView());
            E.galleryInfo.textContent = '系列「' + currentSeries + '」· ' + rs.length + ' 次出图 · '
                + countImages(rs) + ' 张图'
                + (names.length > 1 ? ('　（共 ' + names.length + ' 个系列）') : '');
        }

        /* 手动刷新画廊 —— 新出的图不会自己上图，必须点「刷新图片」才拉一次 _internal/output/ */
        async function reloadGallery() {
            E.reload.disabled = true;
            E.galleryInfo.textContent = '正在扫描 _internal/output/ …';
            try {
                await loadHistory();
                E.progressText.textContent = '画廊已刷新：读到 ' + allRuns.length + ' 个批次 / '
                    + countImages(allRuns) + ' 张图';
            } finally {
                E.reload.disabled = false;
            }
        }

        /* 窗口重新获得焦点时同步一次画廊 —— 命令行练图 / 删图后切回窗口即可看到最新结果，
           不必再手点「刷新图片」。只在「画廊已经加载过」之后生效：刚打开页面时仍然不自动拉，
           命令行练的图不会自己冒出来（保留原来的设计）。 */
        window.addEventListener('focus', async () => {
            if (!galleryLoaded || gallerySyncing || pollTimer || busy) return;
            gallerySyncing = true;
            try { await loadHistory(currentRunId === ALL ? null : currentRunId); }
            finally { gallerySyncing = false; }
        });

        /* ---------------- 出图与进度 ---------------- */
        function setBusy(state) {
            busy = state;
            E.generate.disabled = state;
            E.generate.classList.toggle('opacity-50', state);
            E.generate.classList.toggle('cursor-not-allowed', state);
        }

        function startPolling(runId) {
            if (pollTimer) clearInterval(pollTimer);
            const tick = async () => {
                let d;
                try { d = await api.get('/local/run/' + runId); } catch (err) { return; }
                const run = d.run;
                const total = run.queued || run.count || 1;
                const done = run.done_count || 0;
                E.progress.style.width = Math.round(done / total * 100) + '%';
                E.runInfo.textContent = run.run_id;
                if (run.status === 'running') {
                    E.progressText.textContent = '生成中… ' + done + '/' + total;
                    E.galleryInfo.textContent = '已出 ' + done + ' / ' + total + ' 张';
                } else if (run.status === 'done') {
                    E.progressText.textContent = '完成，共 ' + (run.saved || 0) + ' 张 · 已归档到 _internal/output/'
                        + (run.series || '未归类') + '/' + run.run_id + '/';
                    clearInterval(pollTimer); pollTimer = null; setBusy(false);
                    currentRunId = run.run_id;
                    renderGallery(run);
                    loadHistory(run.run_id);
                } else {
                    E.progressText.textContent = '失败：' + (run.error || '未知原因');
                    E.galleryInfo.textContent = '';
                    clearInterval(pollTimer); pollTimer = null; setBusy(false);
                }
                renderGallery(run);
            };
            tick();
            pollTimer = setInterval(tick, 1500);
        }

        async function generate() {
            if (busy) return;
            const positive = E.positive.value.trim();
            if (!positive) {
                E.progressText.textContent = '正向提示词不能为空';
                E.positive.focus();
                return;
            }
            const body = {
                positive: positive,
                negative: E.negative.value.trim() || null,
                series: E.series.value.trim() || null,
                model: E.model.value || null,
                sampler_name: E.sampler.value || null,
                scheduler: E.scheduler.value || null,
                steps: E.steps.value ? Number(E.steps.value) : null,
                cfg: E.cfg.value ? Number(E.cfg.value) : null,
                width: E.width.value ? Number(E.width.value) : null,
                height: E.height.value ? Number(E.height.value) : null,
                count: E.count.value ? Number(E.count.value) : 1,
                seed: E.seed.value === '' ? null : Number(E.seed.value),
                seed_stride: E.seedStride.value ? Number(E.seedStride.value) : null
            };
            try { localStorage.setItem('tagsd.series', E.series.value.trim()); } catch (err) { /* 隐私模式等 */ }
            setBusy(true);
            E.progressText.textContent = '正在提交…';
            E.progress.style.width = '2%';
            E.gallery.innerHTML = '';
            galleryImages.length = 0;
            E.gallery.dataset.sig = '';
            let res;
            try {
                res = await api.post('/local/generate', body);
            } catch (err) {
                setBusy(false);
                E.progressText.textContent = '请求出错：' + err.message;
                return;
            }
            if (!res.ok) {
                setBusy(false);
                E.progressText.textContent = '提交失败：' + (res.error || JSON.stringify(res.errors || res));
                return;
            }
            E.runInfo.textContent = res.run_id;
            E.progressText.textContent = '已排队 ' + res.queued + ' 张';
            startPolling(res.run_id);
        }
        /* ---------------- 事件绑定 ---------------- */
        E.fillTags.addEventListener('click', () => fillPositive(tagsFromBoard(), '已选标签区是空的'));
        E.fillOutput.addEventListener('click', () => {
            const out = document.getElementById('formatted-output');
            fillPositive(out ? out.value.trim() : '', '格式化文本是空的');
        });
        E.fillBase.addEventListener('click', () => {
            const base = defaults && defaults.positive && defaults.positive.base;
            fillPositive(base || '', '工作流里没有基础正向词');
        });
        E.dice.addEventListener('click', () => { E.seed.value = Math.floor(Math.random() * 2147483647); });
        E.generate.addEventListener('click', generate);
        E.refresh.addEventListener('click', refresh);
        E.reload.addEventListener('click', reloadGallery);
        E.openDir.addEventListener('click', () => {
            if (currentRunId && currentRunId !== ALL) reveal(null, currentRunId);
            else if (currentSeries) reveal(currentSeriesDir(), null);
            else reveal(null, null);
        });
        E.delRun.addEventListener('click', () => {
            if (currentRunId === ALL) {
                E.progressText.textContent = '「全部」是合并视图，请先选一个具体批次再整批删除，或逐张删';
                return;
            }
            if (!currentRunId) { E.progressText.textContent = '当前没有可删除的批次'; return; }
            confirmThen(E.delRun, '确认删除整批？', () => doDelete(currentRunId, null, '整批'));
        });
        E.shutdown.addEventListener('click', () => {
            confirmThen(E.shutdown, '确认关闭？', async () => {
                E.progressText.textContent = '正在关闭服务…（ComfyUI、页面窗口、终端窗口会一起收掉）';
                try { await fetch('/local/shutdown', { method: 'POST' }); }
                catch (err) { /* 服务已经在关了 */ }
            });
        });
        E.lightboxClose.addEventListener('click', closeLightbox);
        E.lightboxPrev.addEventListener('click', e => { e.stopPropagation(); stepLightbox(-1); });
        E.lightboxNext.addEventListener('click', e => { e.stopPropagation(); stepLightbox(1); });
        E.lightbox.addEventListener('click', e => { if (e.target === E.lightbox) closeLightbox(); });
        document.addEventListener('keydown', e => {
            if (E.lightbox.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') stepLightbox(-1);
            else if (e.key === 'ArrowRight') stepLightbox(1);
        });
        E.interrupt.addEventListener('click', async () => {
            try { await api.post('/local/interrupt', null); E.progressText.textContent = '已发送中断指令'; }
            catch (err) { E.progressText.textContent = '中断失败'; }
        });
        E.clear.addEventListener('click', async () => {
            try { await api.post('/api/queue', { clear: true }); E.progressText.textContent = '已清空 ComfyUI 等待队列'; }
            catch (err) { E.progressText.textContent = '清空失败'; }
        });
        E.free.addEventListener('click', async () => {
            try { await api.post('/local/free', null); E.progressText.textContent = '已请求释放显存'; }
            catch (err) { E.progressText.textContent = '释放失败'; }
        });

        function boot() {
            refresh();
            // 不再自动 loadHistory()：命令行练的图不该自己冒到页面上。
            // 想看已有出图请点「刷新图片」；自己出图完成后仍然会自动显示那一批（见 startPolling）。
            E.gallery.dataset.sig = '';
            E.gallery.innerHTML = '<p class="text-xs text-slate-500 col-span-full">点右上角「刷新图片」加载已有出图。</p>';
            E.galleryInfo.textContent = '未加载（点「刷新图片」）';
            // 记住上次用的系列名：同一个主题继续迭代时不用每次重打
            try {
                const s = localStorage.getItem('tagsd.series');
                if (s) E.series.value = s;
            } catch (err) { /* 隐私模式等 */ }
            // 没连上时 3 秒探一次（ComfyUI 启动中），连上后降到 15 秒
            const loop = () => {
                if (!pollTimer) ping();
                setTimeout(loop, connOk ? 15000 : 3000);
            };
            setTimeout(loop, 3000);
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }



    })();
    </script>

</body>
</html>
