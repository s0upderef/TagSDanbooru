<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagSDanbooru · Danbooru 标签助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <style>
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20%);
            box-shadow: 0 4px 10px -1px rgba(0, 0, 0, 0.55);
            margin-bottom: 0.5rem;
            transition: box-shadow 0.2s ease;
        }
        header.scrolled {
            box-shadow: 0 6px 18px -2px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #0b1220 0%, #111c2e 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tag-selected {
            filter: grayscale(45%);
            transform: scale(0.95);
            box-shadow: none;
        }
        .tag-selected::after {
            content: '✔';
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #3b82f6;
            color: white;
            border-radius: 9999px;
            width: 18px;
            height: 18px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            line-height: 1;
            box-shadow: 0 0 0 2px #0b1220;
        }
        .sortable-ghost {
            opacity: 0.6;
            background: rgba(56, 189, 248, 0.18);
            outline: 2px dashed rgba(56, 189, 248, 0.6);
            outline-offset: -4px;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #1e293b;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        .tag-item {
            transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
            cursor: pointer;
            position: relative; /* For positioning the badge */
        }
        .tag-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(56, 189, 248, 0.35);
        }
        .tag-item:active {
            transform: scale(0.96);
        }
        .category-btn {
            transition: all 0.2s ease;
        }
        .format-btn {
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
            font-weight: 500;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
            border: 1px solid #475569;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .progress-bar {
            transition: width 0.3s ease;
            background-image: linear-gradient(45deg, rgba(255,255,255,0.18) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.18) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: stripes 0.8s linear infinite;
        }
        @keyframes stripes {
            from { background-position: 0 0; }
            to { background-position: 1rem 0; }
        }
        .tag-tooltip {
            position: fixed;
            background: rgba(2, 6, 23, 0.96);
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
            white-space: pre-line;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .compact-tag {
            height: 50px;
            padding: 0.5rem;
        }
        .tag-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
        }
        .stats-card {
            background: linear-gradient(135deg, #16233a 0%, #1b2a42 100%);
            border: 1px solid #334155;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid #334155;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: 600;
            color: #38bdf8;
        }
        .compact-container {
            gap: 0.75rem;
        }
        .selected-tag {
            position: relative;
            transition: all 0.2s ease-in-out;
        }
        .selected-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
        }
        .unmatched-tag {
            background-color: #334155; /* slate-700 */
            border: 1px dotted #64748b; /* slate-500 */
            color: #cbd5e1; /* slate-300 */
            transition: all 0.2s ease-in-out;
        }
        .unmatched-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
        }

        /* ===== 动效（克制，只随真实状态变化触发） ===== */
        .btn-primary, .btn-secondary, .btn-danger, .btn-success, .category-btn, .format-btn,
        .stat-button, #update-csv-btn, #reload-app-btn, #copy-text-btn, .pagination-btn {
            transition: background-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease,
                        border-color 0.18s ease, color 0.18s ease;
        }
        .btn-primary:active, .btn-secondary:active, .btn-danger:active, .btn-success:active,
        .category-btn:active, .format-btn:active, .stat-button:active,
        #update-csv-btn:active, #reload-app-btn:active, #copy-text-btn:active, .pagination-btn:active {
            transform: scale(0.97);
        }
        .tag-item.tag-selected:hover {
            transform: translateY(-2px) scale(0.95);
        }
        .selected-tag, .unmatched-tag {
            animation: chipIn 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.82); }
            to   { opacity: 1; transform: scale(1); }
        }
        #tag-list.fade-in {
            animation: listFade 0.18s ease-out;
        }
        @keyframes listFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }
        .stat-button span.font-bold {
            display: inline-block;
        }
        .stat-pulse {
            animation: statPulse 0.45s ease-out;
        }
        @keyframes statPulse {
            0%   { transform: scale(1); color: #38bdf8; }
            45%  { transform: scale(1.16); color: #7dd3fc; }
            100% { transform: scale(1); }
        }
        #formatted-output.flash {
            animation: outFlash 0.6s ease-out;
        }
        @keyframes outFlash {
            0%   { box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .tag-tooltip {
            transition: opacity 0.2s ease, transform 0.12s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Tailwind 类名安全清单：确保只在 JS（CATEGORY_MAP）中出现的暗色类别类也会被生成 -->
    <div style="display:none" aria-hidden="true" class="bg-blue-500/15 text-blue-300 border-blue-500/30 bg-red-500/15 text-red-300 border-red-500/30 bg-purple-500/15 text-purple-300 border-purple-500/30 bg-green-500/15 text-green-300 border-green-500/30 bg-orange-500/15 text-orange-300 border-orange-500/30 bg-pink-500/15 text-pink-300 border-pink-500/30 bg-slate-900/60"></div>
    <div class="container mx-auto p-4 md:p-5 max-w-[1400px] min-h-screen flex flex-col compact-container">
        <!-- 紧凑的头部区域 -->
        <header class="flex justify-between items-center gap-3 p-3 rounded-xl -mt-4">
            <div class="flex items-center gap-3">
                <!-- 网站标题 -->
                <div class="w-8 h-8 rounded-md bg-blue-500 flex items-center justify-center">
                    <i class="fa-solid fa-tags text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-100">Danbooru 标签助手</h1>
                    <p class="text-xs text-slate-400">高效管理与组合标签，提升创作效率</p>
                </div>
            </div>
            <div class="flex-grow max-w-md flex items-center gap-2">
                <!-- 搜索框和重置按钮 -->
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="search" id="search-box" placeholder="搜索标签 (英文/中文/别名/分类/备注)..." class="w-full pl-9 pr-3 h-[36px] border border-slate-600 rounded-md focus:outline-none focus:border-transparent focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>
                <button id="reset-search-btn" title="重置搜索" class="h-[36px] w-10 flex items-center justify-center rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-shrink-0 flex items-center gap-2">
                <!-- 更新CSV：从 GitHub 拉取最新数据，页面立即使用，并自动下载同名文件以便覆盖本地 -->
                <button id="update-csv-btn" title="从 GitHub 下载最新数据：页面立即使用，并自动下载 tagsd_danbooru_zh.csv 覆盖到项目目录" class="h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-emerald-500 text-white hover:bg-emerald-600">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 更新CSV
                </button>
                <button id="reload-app-btn" class="h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600 hidden">
                    <i class="fa-solid fa-arrows-rotate"></i> 重新加载
                </button>
            </div>
        </header>

        <!-- 加载区域 -->
        <div id="load-area-card" class="mb-3 p-3 bg-slate-800 rounded-lg shadow-sm border border-slate-700 space-y-2">
            <div class="space-y-2">
                <div class="flex items-center gap-2">
                    <input type="text" id="csv-url" value="_internal/data/tagsd_danbooru_zh.csv" class="w-full px-3 h-[36px] border border-slate-600 rounded-md focus:outline-none focus:border-transparent focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    <button id="reset-url-btn" title="恢复默认URL" class="h-[36px] w-10 flex items-center justify-center rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="load-url-btn" class="w-full h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 加载网络文件
                    </button>
                    <label for="local-file-btn" class="w-full cursor-pointer h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                        <i class="fa-solid fa-folder-open"></i> 选择本地文件
                    </label>
                    <input type="file" id="local-file-btn" accept=".csv" class="hidden">
                </div>
            </div>
            <div id="status-area" class="text-center">
                <div id="progress-container" class="w-full bg-slate-700 rounded-full h-2 my-2">
                    <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300 ease-linear w-0"></div>
                </div>
                <div id="status-message" class="text-xs min-h-[1rem]">准备加载数据</div>
            </div>
        </div>

        <!-- 中间区域 -->
        <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-3">

            <!-- 现在是左栏 -->
            <div class="md:col-span-2 flex flex-col gap-3">
                <div class="p-3 bg-slate-800 rounded-lg shadow-sm border border-slate-700 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-semibold text-slate-200">已选标签 (<span id="selected-count">0</span>) 个，可拖拽排序、点击取消选择</h2>
                        <div class="flex items-center gap-1">
                            <button id="toggle-lang-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                                <i class="fa-solid fa-language"></i> 切换中英文
                            </button>
                            <button id="save-wildcard-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                                <i class="fa-solid fa-save"></i> 保存为通配符
                            </button>
                            <button id="clear-selected-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                                <i class="fa-solid fa-trash-can"></i> 清空已选
                            </button>
                        </div>
                    </div>
                    <div id="selected-tags-container" class="flex-grow min-h-[135px] bg-slate-900 rounded-md p-2 flex flex-wrap content-start gap-1 overflow-y-auto">
                        <div class="flex flex-col items-center justify-center w-full h-full text-slate-500">
                            <i class="fa-solid fa-tags text-3xl mb-2"></i>
                            <p class="text-sm">尚未选择任何标签</p>
                        </div>
                    </div>
                </div>
                
                <!-- 标签列表区域（紧凑布局） -->
                <div class="bg-slate-800 rounded-lg shadow-sm border border-slate-700 p-3 flex flex-col overflow-hidden">
                    <!-- 紧凑的分类过滤器 -->
                    <div id="category-filters" class="flex flex-wrap items-center gap-1 pb-2">
                        <button id="all-categories" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-globe w-3 text-center"></i><span>全部</span>
                        </button>
                        <button data-category="0" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-tag w-3 text-center"></i><span>通用</span>
                        </button>
                        <button data-category="1" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-palette w-3 text-center"></i><span>画师</span>
                        </button>
                        <button data-category="3" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-copyright w-3 text-center"></i><span>作品</span>
                        </button>
                        <button data-category="4" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-user w-3 text-center"></i><span>角色</span>
                        </button>
                        <button data-category="5" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-info-circle w-3 text-center"></i><span>元数据</span>
                        </button>
                        <button data-category="6" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-cogs w-3 text-center"></i><span>Kontext</span>
                        </button>
                    </div>
                    
                    <!-- 人工分类筛选（一级 → 二级联动；仅覆盖已人工分类的高频词条） -->
                    <div id="l1-filters" class="flex flex-wrap items-center gap-1 pb-1 hidden"></div>
                    <div id="l2-filters" class="flex flex-wrap items-center gap-1 pb-2 hidden"></div>
                    <div id="tag-list-container" class="flex-grow overflow-hidden no-scrollbar py-1 p-1 min-h-[410px]">
                        <div id="tag-list" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-4 2xl:grid-cols-4 gap-2"></div>
                    </div>
                    
                    <div id="pagination-controls" class="mt-2 pt-2 border-t border-slate-700 flex justify-center items-center gap-2 text-xs"></div>
                </div>

            </div>

            <!-- 现在是右栏 -->
            <div class="md:col-span-1 flex flex-col gap-3">
                <div class="p-3 bg-slate-800 rounded-lg shadow-sm border border-slate-700 flex flex-col">
                    <!-- 格式化文本展示区域 -->
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-semibold text-slate-200">格式化文本</h2>
                        <div id="copy-btn" class="flex items-center gap-1">
                            <button id="copy-text-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600">
                                <i class="fa-solid fa-copy"></i><span class="hidden sm:inline">复制</span>
                            </button>
                        </div>
                    </div>
                    <textarea 
                        id="formatted-output" 
                        readonly 
                        class="w-full bg-gray-900 text-green-400 font-mono rounded-md p-2 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 h-32 no-scrollbar resize-none" 
                        placeholder="已选标签组合编辑排序后，格式化文本将显示在这里...">
                    </textarea>
                    <!-- 格式化按钮区域 -->
                    <div id="format-controls" class="flex flex-wrap items-center gap-1 pt-2">
                        <button data-format="comma-space" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-grip-lines"></i><span class="hidden sm:inline">逗号分隔</span>
                        </button>
                        <button data-format="space" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-grip-lines-vertical"></i><span class="hidden sm:inline">空格分隔</span>
                        </button>
                        <button data-format="space-underscore" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-signature"></i><span class="hidden sm:inline">下划线转空格</span>
                        </button>
                        <button data-format="full" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600">
                            <i class="fa-solid fa-asterisk"></i><span class="hidden sm:inline">全格式</span>
                        </button>
                    </div>

                </div>
                
                <!-- 标签详情区 - 始终显示 -->
                <div class="min-h-[290px]">
                    <div id="tag-details-card" class="p-3 rounded-lg bg-slate-800 shadow-sm border border-slate-700">
                        <h2 class="text-sm font-semibold text-slate-200 mb-2">标签详情</h2>
                        <div id="tag-details-content" class="text-xs space-y-1">
                            <p>请点击选择一个标签以查看其详细信息。</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- ==================== 出图工作台 ==================== -->
        <div class="p-3 rounded-lg bg-slate-800 shadow-sm border border-slate-700">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-fuchsia-400"></i> 出图工作台
                    <span class="text-xs font-normal text-slate-500">TagSDanbooru × ComfyUI</span>
                </h2>
                <div class="flex items-center gap-2 text-xs">
                    <span id="wb-dot" class="w-2 h-2 rounded-full bg-slate-500 inline-block"></span>
                    <span id="wb-status" class="text-slate-400">正在检测…</span>
                    <button id="wb-refresh" class="h-7 px-2 flex items-center gap-1 rounded-md transition-colors duration-200 bg-slate-700 text-slate-200 hover:bg-slate-600">
                        <i class="fa-solid fa-rotate"></i> 刷新
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
                <!-- 左：提示词 -->
                <div class="space-y-2">
                    <div class="flex flex-wrap justify-between items-center gap-1">
                        <label class="text-xs font-semibold text-slate-300">正向提示词</label>
                        <div class="flex gap-1">

    <!-- 标签提示工具 -->

    <script>
        // 模块化组织代码
        const TagAssistant = (() => {
            // 常量定义
            // 默认数据源：项目内 _internal/data 下的数据文件（推荐用本地服务器打开，或在“选择本地文件”中手动加载）
            const DEFAULT_URL = '_internal/data/tagsd_danbooru_zh.csv';
            // 网络数据源：本仓库发布的最新快照（“更新CSV”按钮使用）
            const REMOTE_URL = 'https://raw.githubusercontent.com/s0upderef/TagSDanbooru/refs/heads/main/_internal/data/tagsd_danbooru_zh.csv';
            const TAGS_PER_PAGE = 28;
            // 热度异常阈值：官方数据里存在少量被人工“提权”的词条（1000 万+），
            // 会错误地霸占列表最前方；载入时统一按 0 处理，保证排序 / 热度徽章 / 悬停提示三处一致。
            const MAX_PLAUSIBLE_POP = 10000000;
            const CATEGORY_MAP = {
                '0': { name: '通用', icon: 'fa-tag', color: 'blue', bg: 'bg-blue-500/15', text: 'text-blue-300', border: 'border-blue-500/30' },
                '1': { name: '画师', icon: 'fa-palette', color: 'red', bg: 'bg-red-500/15', text: 'text-red-300', border: 'border-red-500/30' },
                '3': { name: '作品', icon: 'fa-copyright', color: 'purple', bg: 'bg-purple-500/15', text: 'text-purple-300', border: 'border-purple-500/30' },
                '4': { name: '角色', icon: 'fa-user', color: 'green', bg: 'bg-green-500/15', text: 'text-green-300', border: 'border-green-500/30' },
                '5': { name: '元数据', icon: 'fa-info-circle', color: 'orange', bg: 'bg-orange-500/15', text: 'text-orange-300', border: 'border-orange-500/30' },
                '6': { name: 'Kontext', icon: 'fa-cogs', color: 'pink', bg: 'bg-pink-500/15', text: 'text-pink-300', border: 'border-pink-500/30' }
            };
            
            // DOM元素
            const elements = {
                csvUrlInput: document.getElementById('csv-url'),
                loadUrlBtn: document.getElementById('load-url-btn'),
                localFileBtn: document.getElementById('local-file-btn'),
                resetUrlBtn: document.getElementById('reset-url-btn'),
                searchBox: document.getElementById('search-box'),
                resetSearchBtn: document.getElementById('reset-search-btn'),
                categoryFilters: document.getElementById('category-filters'),
                progressContainer: document.getElementById('progress-container'),
                progressBar: document.getElementById('progress-bar'),
                statusMessage: document.getElementById('status-message'),
                tagList: document.getElementById('tag-list'),
                tagListContainer: document.getElementById('tag-list-container'),
                paginationControls: document.getElementById('pagination-controls'),
                loadAreaCard: document.getElementById('load-area-card'),
                reloadAppBtn: document.getElementById('reload-app-btn'),
                selectedTagsContainer: document.getElementById('selected-tags-container'),
                toggleLangBtn: document.getElementById('toggle-lang-btn'),
                clearSelectedBtn: document.getElementById('clear-selected-btn'),
                saveWildcardBtn: document.getElementById('save-wildcard-btn'),
                formattedOutput: document.getElementById('formatted-output'),
                formatControls: document.getElementById('format-controls'),
                copyTextBtn: document.getElementById('copy-text-btn'),
                selectedCount: document.getElementById('selected-count'),
                allCategoriesBtn: document.getElementById('all-categories'),
                l1Filters: document.getElementById('l1-filters'),
                l2Filters: document.getElementById('l2-filters'),
                tagTooltip: document.getElementById('tag-tooltip'),
                statsButtonsContainer: document.getElementById('stats-buttons-container'),
                tagDetailsCard: document.getElementById('tag-details-card'),
                tagDetailsContent: document.getElementById('tag-details-content'),
                updateCsvBtn: document.getElementById('update-csv-btn')
            };
            
            // 状态变量
            let state = {
                allTags: [],
                filteredTags: [],
                selectedTags: [],
                currentPage: 1,
                currentCategory: 'all',
                currentL1: 'all',
                currentL2: 'all',
                currentFormat: 'space-underscore',
                selectedTagsLanguage: 'cn',
                mainSortable: null,
                selectedSortable: null,
                categoryCounts: {
                    '0': 0,
                    '1': 0,
                    '3': 0,
                    '4': 0,
                    '5': 0,
                    '6': 0
                },
                tooltipTimeout: null
            };
            
            // 工具函数
            const utils = {
                debounce: (func, delay) => {
                    let timeout;
                    return function(...args) {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => func.apply(this, args), delay);
                    };
                },
                
                formatPopularity: (numStr) => {
                    const num = parseInt(numStr, 10);
                    if (isNaN(num)) return '0';
                    if (num >= 1000000) return `${(num / 1000000).toFixed(1).replace(/\.0$/, '')}M`;
                    if (num >= 1000) return `${(num / 1000).toFixed(1).replace(/\.0$/, '')}K`;
                    return num.toString();
                },
                
                showTooltip: (content, x, y) => {
                    elements.tagTooltip.textContent = content;
                    
                    // 计算最大可显示位置
                    const maxX = window.innerWidth - elements.tagTooltip.offsetWidth - 20;
                    const maxY = window.innerHeight - elements.tagTooltip.offsetHeight - 20;
                    
                    // 确保提示框不会超出屏幕
                    const adjustedX = Math.min(x + 10, maxX);
                    const adjustedY = Math.min(y + 10, maxY);
                    
                    elements.tagTooltip.style.left = `${adjustedX}px`;
                    elements.tagTooltip.style.top = `${adjustedY}px`;
                    elements.tagTooltip.style.opacity = '1';
                },
                
                hideTooltip: () => {
                    elements.tagTooltip.style.opacity = '0';
                },
                
                debounceShowTooltip: (content, x, y) => {
                    // 清除之前的定时器
                    clearTimeout(state.tooltipTimeout);
                    
                    // 设置新的定时器
                    state.tooltipTimeout = setTimeout(() => {
                        utils.showTooltip(content, x, y);
                    }, 300);
                },
                
                cancelShowTooltip: () => {
                    clearTimeout(state.tooltipTimeout);
                    utils.hideTooltip();
                },
                
                updateStats: () => {
                    //if (state.allTags.length === 0) return; //强制清空数据统计

                    // 重置计数
                    state.categoryCounts = { '0': 0, '1': 0, '3': 0, '4': 0, '5': 0, '6': 0 };
                    
                    // 计算每个类别的数量
                    state.allTags.forEach(tag => {
                        const catId = tag[1];
                        if (state.categoryCounts.hasOwnProperty(catId)) {
                            state.categoryCounts[catId]++;
                        }
                    });

                    // 更新UI
                    const buttons = elements.statsButtonsContainer.querySelectorAll('.stat-button');
                    buttons.forEach(btn => {
                        const category = btn.dataset.category;
                        const countSpan = btn.querySelector('span.font-bold');
                        let count = 0;
                        if (category === 'all') {
                            count = state.allTags.length;
                        } else if (state.categoryCounts[category]) {
                            count = state.categoryCounts[category];
                        }
                        countSpan.textContent = count.toLocaleString();
                        // 数字更新脉冲
                        countSpan.classList.remove('stat-pulse');
                        void countSpan.offsetWidth;
                        countSpan.classList.add('stat-pulse');
                    });

                    buildL1Row();
                }
            };
            
            // 数据加载模块
            const dataLoader = {
                loadFile: async (source, options = {}) => {
                    // 重置状态
                    state.allTags = [];
                    state.filteredTags = [];
                    state.selectedTags = [];
                    state.currentPage = 1;
                    
                    state.currentL1 = 'all';
                    state.currentL2 = 'all';
                    elements.tagList.innerHTML = '';
                    elements.paginationControls.innerHTML = '';
                    tagRenderer.renderSelectedTags(); // 确保占位符在加载时正确显示
                    elements.formattedOutput.value = '';
                    elements.selectedCount.textContent = '0';
                    
                    // 隐藏重新加载按钮
                    elements.reloadAppBtn.classList.add('hidden');
                    
                    // 清除上一次的错误样式
                    elements.statusMessage.classList.remove('text-red-500');
                    
                    if (typeof source === 'string') {
                        await dataLoader.loadNetworkFile(source, options);
                    } else {
                        dataLoader.parseCsvData(source, '本地文件');
                    }
                },
                
                loadNetworkFile: async (url, options = {}) => {
                    const { label = '网络文件', downloadAs = null, fallbackUrl = null } = options;
                    try {
                        elements.statusMessage.textContent = '正在连接数据源...';
                        elements.progressBar.style.width = '0%';
                        
                        const response = await fetch(url);
                        
                        if (!response.ok) {
                            throw new Error(`网络错误: ${response.status} ${response.statusText}`);
                        }
                        
                        if (!response.body) {
                            throw new Error('响应中没有数据体');
                        }
                        
                        const contentLength = response.headers.get('content-length');
                        const totalSize = parseInt(contentLength, 10);
                        let receivedLength = 0;
                        const chunks = [];
                        const reader = response.body.getReader();
                        
                        elements.statusMessage.textContent = '正在下载文件...';
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            chunks.push(value);
                            receivedLength += value.length;
                            
                            if (totalSize) {
                                const progress = Math.round((receivedLength / totalSize) * 100);
                                elements.progressBar.style.width = `${progress}%`;
                            }
                        }
                        
                        const blob = new Blob(chunks);
                        
                        // 若指定了 downloadAs，则额外触发浏览器下载，便于覆盖本地数据文件
                        let suffix = '';
                        if (downloadAs) {
                            const link = document.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = downloadAs;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            setTimeout(() => URL.revokeObjectURL(link.href), 3000);
                            suffix = ` 已同时下载 ${downloadAs}，可用它覆盖项目内同名文件（长期生效）。`;
                        }
                        
                        dataLoader.parseCsvData(blob, label, { suffix, keepLoadArea: !!downloadAs });
                    } catch (error) {
                        // 本地文件读取失败（常见于 file:// 直接打开），自动回退到网络数据源
                        if (fallbackUrl && fallbackUrl !== url) {
                            elements.statusMessage.classList.remove('text-red-500');
                            elements.statusMessage.textContent = '本地数据文件读取失败（file:// 下浏览器禁止直接读取本地文件），已自动改用网络数据...';
                            return dataLoader.loadNetworkFile(fallbackUrl, { label: '网络文件' });
                        }
                        elements.statusMessage.textContent = `加载失败: ${error.message}`;
                        elements.statusMessage.classList.add('text-red-500');
                    }
                },
                
                // 归一化异常热度（同时防止“更新CSV”把脏数据带回来）
                normalizeRow: (row) => {
                    const pop = parseInt(row[2], 10);
                    if (!isNaN(pop) && pop >= MAX_PLAUSIBLE_POP) {
                        row[2] = '0';
                        state.outlierCount++;
                    }
                    return row;
                },

                parseCsvData: (data, sourceName, options = {}) => {
                    const startTime = performance.now();
                    elements.statusMessage.textContent = '开始解析数据...';
                    state.outlierCount = 0;
                    
                    Papa.parse(data, {
                        header: false,
                        skipEmptyLines: true,
                        chunk: (results, parser) => {
                            // 归一化异常热度（同时防止“更新CSV”把脏数据带回来）
                            const rows = results.data.map(row => dataLoader.normalizeRow(row));
                            state.allTags = state.allTags.concat(rows);
                            const rowCount = state.allTags.length;
                            const progress = Math.min((rowCount / 160000) * 100, 100);
                            elements.progressBar.style.width = `${progress}%`;
                            elements.statusMessage.textContent = `已解析 ${rowCount.toLocaleString()} 行...`;
                        },
                        complete: () => {
                            // 排序: 按热度从高到低
                            state.allTags.sort((a, b) => (parseInt(b[2], 10) || 0) - (parseInt(a[2], 10) || 0));
                            
                            const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                            elements.progressBar.style.width = '100%';
                            
                            tagManager.applyFilters();
                            utils.updateStats();
                            
                            const outlierNote = state.outlierCount ? `（已自动修正 ${state.outlierCount.toLocaleString()} 条异常热度）` : '';
                            const finalMessage = `${sourceName}加载完成！共 ${state.allTags.length.toLocaleString()} 个标签，耗时 ${duration} 秒。${outlierNote}${options.suffix || ''}`;
                            elements.statusMessage.textContent = finalMessage;
                            
                            if (options.keepLoadArea) {
                                // 更新CSV流程：保留加载区，便于查看结果与提示
                                elements.reloadAppBtn.classList.remove('hidden'); // 加载完成后显示重新加载按钮
                            } else {
                                // 加载完立即隐藏加载区（不再等待 2 秒）
                                elements.loadAreaCard.classList.add('hidden');
                                elements.reloadAppBtn.classList.remove('hidden'); // 加载完成后显示重新加载按钮
                            }
                            
                            // 初始化拖拽排序
                            initSortable();
                            
                            // 显示重新加载按钮
                            // elements.reloadAppBtn.classList.remove('hidden');
                        },
                        error: (error) => {
                            elements.statusMessage.textContent = `解析失败: ${error.message}`;
                            elements.statusMessage.classList.add('text-red-500');
                            
                            // 显示重新加载按钮
                            elements.reloadAppBtn.classList.remove('hidden');
                        }
                    });
                },
                
                // 快路径：服务端预转好的 JSON。
                // JSON.parse 由引擎原生实现，比逐字符解析 CSV 快两个数量级。
                parseTagJson: (rows, sourceName, options = {}) => {
                    const startTime = performance.now();
                    elements.statusMessage.textContent = '正在载入标签数据...';
                    state.outlierCount = 0;
                    const tags = new Array(rows.length);
                    for (let i = 0; i < rows.length; i++) {
                        tags[i] = dataLoader.normalizeRow(rows[i]);
                    }
                    // 排序: 按热度从高到低（与 CSV 路径保持一致）
                    tags.sort((a, b) => (parseInt(b[2], 10) || 0) - (parseInt(a[2], 10) || 0));
                    state.allTags = tags;

                    tagManager.applyFilters();
                    utils.updateStats();

                    const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                    elements.progressBar.style.width = '100%';
                    const outlierNote = state.outlierCount ? `（已自动修正 ${state.outlierCount.toLocaleString()} 条异常热度）` : '';
                    elements.statusMessage.textContent = `${sourceName}加载完成！共 ${state.allTags.length.toLocaleString()} 个标签，耗时 ${duration} 秒。${outlierNote}${options.suffix || ''}`;

                    // 加载完立即隐藏加载区
                    elements.loadAreaCard.classList.add('hidden');
                    elements.reloadAppBtn.classList.remove('hidden');
                    initSortable();
                },

                // 开页面立刻加载：优先用服务端预转的 JSON，拿不到就回退 CSV 路径。
                // 直接以 file:// 打开页面时 /local/status 不可用，自动走回退分支。
                loadDefault: async () => {
                    let meta = null;
                    try {
                        const r = await fetch('/local/status', { cache: 'no-store' });
                        if (r.ok) meta = (await r.json()).tag_data || null;
                    } catch (err) { /* 本地服务不可用时静默回退 */ }

                    if (meta && meta.format === 'json' && meta.exists) {
                        try {
                            elements.statusMessage.textContent = meta.rows
                                ? `正在载入 ${meta.rows.toLocaleString()} 条标签（JSON 缓存）...`
                                : '正在载入标签数据...';
                            elements.progressBar.style.width = '35%';
                            const resp = await fetch(meta.url);
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            const rows = await resp.json();
                            dataLoader.parseTagJson(rows, '本地标签数据', {});
                            return;
                        } catch (err) {
                            elements.statusMessage.classList.remove('text-red-500');
                        }
                    }
                    dataLoader.loadFile(DEFAULT_URL, { label: '本地数据文件', fallbackUrl: REMOTE_URL });
                }
            };
            
            // 标签渲染模块
            const tagRenderer = {
                renderTagList: () => {
                    elements.tagList.innerHTML = '';
                    
                    const startIndex = (state.currentPage - 1) * TAGS_PER_PAGE;
                    const endIndex = Math.min(startIndex + TAGS_PER_PAGE, state.filteredTags.length);
                    const visibleTags = state.filteredTags.slice(startIndex, endIndex);
                    
                    if (visibleTags.length === 0) {
                        elements.tagList.innerHTML = `
                            <div class="col-span-full text-center py-10 text-slate-400">
                                <i class="fa-solid fa-inbox text-3xl mb-3"></i>
                                <p class="text-base">没有找到匹配的标签</p>
                                <p class="mt-1 text-sm">尝试修改搜索条件或选择其他分类</p>
                            </div>
                        `;
                        return;
                    }
                    
                    visibleTags.forEach(tag => {
                        const [enTag, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                        const isSelected = state.selectedTags.some(t => t[0] === enTag);
                        const category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];
                        
                        // 创建标签详细信息（用于悬停提示）
                        const details = [
                            `英文: ${enTag || 'N/A'}`,
                            `中文: ${cnTag || '无'}`,
                            `别名: ${alias || '无'}`,
                            `热度: ${pop || '0'}`,
                            `类别: ${category.name}`,
                            `一级分类: ${l1 || '无'}`,
                            `二级分类: ${l2 || '无'}`,
                            `备注: ${notes || '无'}`
                        ].join('\n');
                        
                        const tagEl = document.createElement('div');
                        tagEl.className = `tag-item compact-tag p-2 rounded-md flex items-center justify-between ${category.bg} ${category.text} hover:ring-1 hover:ring-offset-1 hover:ring-${category.color}-400 text-sm ${isSelected ? 'tag-selected' : ''}`;
                        tagEl.innerHTML = `
                            <div class="flex items-center overflow-hidden mr-2">
                                <i class="fa-solid ${category.icon} w-3 text-center mr-2"></i>
                                <div class="overflow-hidden">
                                    <p class="font-semibold truncate text-xs">${cnTag || enTag}</p>
                                    ${cnTag ? `<p class="text-2xs ${category.text} opacity-80 truncate">${enTag}</p>` : ''}
                                </div>
                            </div>
                            <div class="text-2xs font-mono bg-slate-900/60 px-1 py-0.5 rounded tag-badge">${utils.formatPopularity(pop)}</div>
                        `;
                        
                        tagEl.dataset.enTag = enTag;
                        tagEl.dataset.details = details;
                        
                        // 添加悬停提示
                        tagEl.addEventListener('mouseenter', (e) => {
                            utils.debounceShowTooltip(details, e.clientX, e.clientY);
                        });
                        
                        tagEl.addEventListener('mouseleave', () => {
                            utils.cancelShowTooltip();
                        });
                        
                        tagEl.addEventListener('click', () => {
                            tagManager.toggleTagSelection(tag, tagEl);
                            tagDetails.update(tag);
                        });
                        
                        elements.tagList.appendChild(tagEl);
                    });
                    
                    // 列表刷新动效
                    elements.tagList.classList.remove('fade-in');
                    void elements.tagList.offsetWidth;
                    elements.tagList.classList.add('fade-in');
                    
                    tagRenderer.renderPagination();
                },
                
                renderSelectedTags: () => {
                    elements.selectedTagsContainer.innerHTML = '';
                    elements.selectedCount.textContent = state.selectedTags.length;
                    
                    if (state.selectedTags.length === 0) {
                        elements.selectedTagsContainer.innerHTML = `
                            <div class="flex flex-col items-center justify-center w-full h-full text-slate-500 p-4 text-center">
                                <i class="fa-solid fa-hand-pointer text-3xl mb-2"></i>
                                <p class="text-sm font-semibold">这里是已选标签区</p>
                                <p class="text-xs mt-1">您可以从下方的“标签列表”点击添加标签，或在左侧“格式化文本”区粘贴并解析您的提示词。</p>
                            </div>
                        `;
                        
                        // 修复：清空已选标签时更新格式化输出
                        formatter.updateFormattedOutput();
                        return;
                    }
                    
                    state.selectedTags.forEach(tag => {
                        const isUnmatched = !tag[1]; // 未匹配的标签没有类别ID
                        const enTag = tag[0];
                        
                        let displayText, category, details, tagElClass;

                        if (isUnmatched) {
                            displayText = enTag;
                            details = `未匹配标签: ${enTag}`;
                            tagElClass = `unmatched-tag h-[32px] px-2 flex items-center justify-between gap-1 rounded-md shadow-sm border min-w-[60px] max-w-[180px] text-xs font-bold`;
                        } else {
                            const [_, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                            displayText = state.selectedTagsLanguage === 'cn' ? (cnTag || enTag) : enTag;
                            category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];
                            details = [
                                `英文: ${enTag || 'N/A'}`,
                                `中文: ${cnTag || '无'}`,
                                `别名: ${alias || '无'}`,
                                `热度: ${pop || '0'}`,
                                `类别: ${category.name}`,
                                `一级分类: ${l1 || '无'}`,
                                `二级分类: ${l2 || '无'}`,
                                `备注: ${notes || '无'}`
                            ].join('\n');
                            tagElClass = `selected-tag h-[32px] px-2 flex items-center justify-between gap-1 rounded-md shadow-sm border ${category.border} ${category.bg} ${category.text} min-w-[60px] max-w-[180px] text-xs font-bold`;
                        }
                        
                        const tagEl = document.createElement('div');
                        tagEl.className = tagElClass;
                        tagEl.innerHTML = `
                            <span class="truncate">${displayText}</span>
                            <button class="remove-selected-tag-btn font-bold text-lg leading-none ${isUnmatched ? 'text-red-400' : `text-${category.color}-500 hover:text-${category.color}-700`}">×</button>
                        `;
                        
                        tagEl.dataset.enTag = enTag;
                        tagEl.dataset.details = details;
                        
                        // 添加悬停提示
                        tagEl.addEventListener('mouseenter', (e) => {
                            utils.debounceShowTooltip(details, e.clientX, e.clientY);
                        });
                        
                        tagEl.addEventListener('mouseleave', () => {
                            utils.cancelShowTooltip();
                        });
                        
                        tagEl.addEventListener('click', (e) => {
                            // 确保不是点击删除按钮
                            if (!e.target.closest('.remove-selected-tag-btn')) {
                                tagDetails.update(tag);
                            }
                        });
                        
                        tagEl.querySelector('.remove-selected-tag-btn').addEventListener('click', e => { 
                            e.stopPropagation(); 
                            const mainListEl = findTagElementInMainList(enTag);
                            tagManager.toggleTagSelection(tag, mainListEl);
                        });
                        
                        elements.selectedTagsContainer.appendChild(tagEl);
                    });
                    
                    formatter.updateFormattedOutput();
                },
                
                renderPagination: () => {
                    elements.paginationControls.innerHTML = '';
                    const totalPages = Math.ceil(state.filteredTags.length / TAGS_PER_PAGE);
                    
                    if (totalPages <= 1) return;
                    
                    const createButton = (icon, page, disabled = false) => {
                        const button = document.createElement('button');
                        button.className = `pagination-btn px-2 py-1 bg-slate-800 border border-slate-600 rounded-md hover:bg-slate-900 transition-colors text-xs ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
                        button.innerHTML = `<i class="fa-solid ${icon}"></i>`;
                        button.disabled = disabled;
                        button.dataset.page = page;
                        return button;
                    };
                    
                    elements.paginationControls.appendChild(createButton('fa-angles-left', 1, state.currentPage === 1));
                    elements.paginationControls.appendChild(createButton('fa-angle-left', state.currentPage - 1, state.currentPage === 1));
                    
                    const pageInfo = document.createElement('span');
                    pageInfo.className = 'px-2 text-slate-300 text-xs';
                    pageInfo.textContent = `第 ${state.currentPage} / ${totalPages} 页`;
                    elements.paginationControls.appendChild(pageInfo);
                    
                    elements.paginationControls.appendChild(createButton('fa-angle-right', state.currentPage + 1, state.currentPage === totalPages));
                    elements.paginationControls.appendChild(createButton('fa-angles-right', totalPages, state.currentPage === totalPages));
                }
            };
            
            // 标签管理模块
            const tagManager = {
                toggleTagSelection: (tag, element) => {
                    const enTag = tag[0];
                    const index = state.selectedTags.findIndex(t => t[0] === enTag);
                    
                    if (index > -1) {
                        state.selectedTags.splice(index, 1);
                        if (element) element.classList.remove('tag-selected');
                    } else {
                        state.selectedTags.push(tag);
                        if (element) element.classList.add('tag-selected');
                    }
                    
                    tagRenderer.renderSelectedTags();
                },
                
                clearSelectedTags: () => {
                    state.selectedTags = [];
                    document.querySelectorAll('.tag-item').forEach(el => {
                        el.classList.remove('tag-selected');
                    });
                    tagRenderer.renderSelectedTags();
                    tagDetails.update();
                },
                
                applyFilters: () => {
                    const query = elements.searchBox.value.toLowerCase().trim();
                    
                    state.filteredTags = state.allTags.filter(tag => {
                        // 按类别过滤
                        if (state.currentCategory !== 'all' && tag[1] !== state.currentCategory) {
                            return false;
                        }

                        // 按人工分类过滤（一级 / 二级）
                        if (state.currentL1 !== 'all' && (tag[5] || '').trim() !== state.currentL1) {
                            return false;
                        }
                        if (state.currentL2 !== 'all' && (tag[6] || '').trim() !== state.currentL2) {
                            return false;
                        }
                        
                        // 按搜索词过滤
                        if (query) {
                            const searchText = `${tag[0]} ${tag[4]} ${tag[3]} ${tag[1]} ${tag[5]} ${tag[6]} ${tag[7]}`.toLowerCase();
                            return searchText.includes(query);
                        }
                        
                        return true;
                    });
                    
                    state.currentPage = 1;
                    tagRenderer.renderTagList();
                }
            };

            // 标签详情模块
            const tagDetails = {
                update: (tag) => {  // 重命名 show 为 update
                    if (!tag) {
                        elements.tagDetailsContent.innerHTML = '<p>请点击选择一个标签以查看其详细信息。</p>';
                        return;
                    }
                    const [enTag, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                    const category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];

                    const detailsHtml = `
                        <p><strong>英文:</strong> <span class="font-mono text-sky-400">${enTag || 'N/A'}</span></p>
                        <p><strong>中文:</strong> ${cnTag || '无'}</p>
                        <p><strong>类别:</strong> <span class="font-semibold" style="color: ${category.color}">${category.name}</span></p>
                        <p><strong>热度:</strong> ${pop ? parseInt(pop).toLocaleString() : '0'}</p>
                        <p><strong>别名:</strong> ${alias || '无'}</p>
                        <p><strong>一级分类:</strong> ${l1 || '无'}</p>
                        <p><strong>二级分类:</strong> ${l2 || '无'}</p>
                        <p><strong>备注:</strong> ${notes || '无'}</p>
                    `;

                    elements.tagDetailsContent.innerHTML = detailsHtml;
                }
            };
            
            // 格式化模块
            const formatter = {
                updateFormattedOutput: () => {
                    let output = '';
                    const tags = state.selectedTags.map(row => row[0]);
                    
                    switch(state.currentFormat) {
                        case 'comma-space':
                            output = tags.join(', ');
                            break;
                        case 'space':
                            output = tags.join(' ');
                            break;
                        case 'space-underscore':
                            output = tags.map(tag => tag.replace(/_/g, ' ')).join(', ');
                            break;
                        case 'full':
                            output = tags.map(tag => `(${tag.replace(/_/g, ' ')}:1.1)`).join(', ');
                            break;
                    }
                    
                    const changed = elements.formattedOutput.value !== output;
                    elements.formattedOutput.value = output;
                    if (changed) {
                        // 内容变化时轻微闪一下
                        elements.formattedOutput.classList.remove('flash');
                        void elements.formattedOutput.offsetWidth;
                        elements.formattedOutput.classList.add('flash');
                    }
                },
                
                copyToClipboard: () => {
                    if (!elements.formattedOutput.value) return;
                    
                    elements.formattedOutput.select();
                    navigator.clipboard.writeText(elements.formattedOutput.value).then(() => {
                        const originalText = '复制';
                        elements.copyTextBtn.innerHTML = `<i class="fa-solid fa-check"></i><span class="hidden sm:inline">已复制!</span>`;
                        elements.copyTextBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                        elements.copyTextBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                        
                        setTimeout(() => {
                            elements.copyTextBtn.innerHTML = `<i class="fa-solid fa-copy"></i><span class="hidden sm:inline">${originalText}</span>`;
                            elements.copyTextBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                            elements.copyTextBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                        }, 2000);
                    });
                },
                
                saveAsWildcard: () => {
                    if (state.selectedTags.length === 0) return;
                    
                    const content = state.selectedTags.map(tag => tag[0]).join('\n');
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const link = document.createElement('a');
                    
                    link.href = URL.createObjectURL(blob);
                    link.download = 'danbooru_tags.txt';
                    link.click();
                    URL.revokeObjectURL(link.href);
                }
            };
            
            // 初始化拖拽排序
            const initSortable = () => {
                if (typeof Sortable === 'undefined') return;
                
                // 主标签列表
                state.mainSortable = new Sortable(elements.tagList, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    group: 'shared'
                });
                
                // 已选标签列表
                state.selectedSortable = new Sortable(elements.selectedTagsContainer, {
                    animation: 150,
                    group: 'shared',
                    onEnd: (evt) => {
                        const newOrder = Array.from(evt.to.children).map(el => {
                            const enTag = el.dataset.enTag;
                            return state.selectedTags.find(tag => tag[0] === enTag);
                        }).filter(tag => tag);
                        
                        state.selectedTags = newOrder;
                        tagRenderer.renderSelectedTags();
                    }
                });
            };
            
            // 辅助函数
            const findTagElementInMainList = (enTag) => {
                return elements.tagList.querySelector(`[data-en-tag="${enTag}"]`);
            };
            
            // ---- 人工分类筛选（一级 → 二级联动；只覆盖已人工分类的高频词条）----
            const L2_TOP_N = 20;

            const countByColumn = (idx) => {
                const m = new Map();
                state.allTags.forEach(tag => {
                    const v = (tag[idx] || '').trim();
                    if (v) m.set(v, (m.get(v) || 0) + 1);
                });
                return m;
            };

            const makeCatBtn = (label, attr, value, count) => {
                const btn = document.createElement('button');
                btn.className = 'category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-slate-700 text-slate-200 hover:bg-slate-600';
                btn.dataset[attr] = value;
                btn.innerHTML = '<i class="fa-solid fa-layer-group w-3 text-center"></i><span>' + label + '</span>' +
                                (count === null ? '' : '<span class="opacity-60">' + count + '</span>');
                return btn;
            };

            const syncBtnRow = (row, attr, current) => {
                if (!row) return;
                row.querySelectorAll('button').forEach(btn => {
                    const on = btn.dataset[attr] === current;
                    btn.classList.toggle('bg-blue-500', on);
                    btn.classList.toggle('text-white', on);
                    btn.classList.toggle('hover:bg-blue-600', on);
                    btn.classList.toggle('bg-slate-700', !on);
                    btn.classList.toggle('text-slate-200', !on);
                    btn.classList.toggle('hover:bg-slate-600', !on);
                });
            };

            const updateL1ButtonStyles = () => syncBtnRow(elements.l1Filters, 'l1', state.currentL1);
            const updateL2ButtonStyles = () => syncBtnRow(elements.l2Filters, 'l2', state.currentL2);

            const buildL2Row = () => {
                const scoped = state.currentL1 === 'all'
                    ? state.allTags
                    : state.allTags.filter(tag => (tag[5] || '').trim() === state.currentL1);
                const counts = new Map();
                scoped.forEach(tag => {
                    const v = (tag[6] || '').trim();
                    if (v) counts.set(v, (counts.get(v) || 0) + 1);
                });
                if (counts.size === 0) {
                    elements.l2Filters.classList.add('hidden');
                    elements.l2Filters.innerHTML = '';
                    return;
                }
                elements.l2Filters.classList.remove('hidden');
                elements.l2Filters.innerHTML = '';
                elements.l2Filters.title = '二级分类（' + (state.currentL1 === 'all' ? '全库前 ' + L2_TOP_N : state.currentL1) + '）';
                elements.l2Filters.appendChild(makeCatBtn('全部', 'l2', 'all', null));
                Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).slice(0, L2_TOP_N).forEach(([name, n]) => {
                    elements.l2Filters.appendChild(makeCatBtn(name, 'l2', name, n));
                });
                updateL2ButtonStyles();
            };

            const buildL1Row = () => {
                const counts = countByColumn(5);
                if (counts.size === 0) {
                    elements.l1Filters.classList.add('hidden');
                    elements.l2Filters.classList.add('hidden');
                    return;
                }
                elements.l1Filters.classList.remove('hidden');
                elements.l1Filters.title = '一级分类：仅覆盖已人工分类的 ' +
                    Array.from(counts.values()).reduce((a, b) => a + b, 0) + ' 条热门词条';
                elements.l1Filters.innerHTML = '';
                elements.l1Filters.appendChild(makeCatBtn('全部', 'l1', 'all', null));
                Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).forEach(([name, n]) => {
                    elements.l1Filters.appendChild(makeCatBtn(name, 'l1', name, n));
                });
                buildL2Row();
                updateL1ButtonStyles();
            };

            const updateCategoryButtonStyles = () => {
                elements.categoryFilters.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                    btn.classList.add('bg-slate-700', 'text-slate-200', 'hover:bg-slate-600');
                    
                    if ((btn === elements.allCategoriesBtn && state.currentCategory === 'all') || 
                        btn.dataset.category === state.currentCategory) {
                        btn.classList.add('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                        btn.classList.remove('bg-slate-700', 'text-slate-200', 'hover:bg-slate-600');
                    }
                });
            };
            
            const updateFormatButtonStyles = () => {
                elements.formatControls.querySelectorAll('.format-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                    btn.classList.add('bg-slate-700', 'text-slate-200', 'hover:bg-slate-600');
                    
                    if (btn.dataset.format === state.currentFormat) {
                        btn.classList.add('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                        btn.classList.remove('bg-slate-700', 'text-slate-200', 'hover:bg-slate-600');
                    }
                });
            };
            
            // 事件处理模块
            const eventHandler = {
                init: () => {
                    // 搜索框事件
                    elements.searchBox.addEventListener('input', utils.debounce(() => {
                        tagManager.applyFilters();
                    }, 300));
                    
                    // 重置搜索按钮
                    elements.resetSearchBtn.addEventListener('click', () => {
                        elements.searchBox.value = '';
                        state.currentCategory = 'all';
                        state.currentL1 = 'all';
                        state.currentL2 = 'all';
                        updateCategoryButtonStyles();
                        buildL2Row();
                        updateL1ButtonStyles();
                        tagManager.applyFilters();
                    });
                    
                    // 分类过滤事件
                    elements.categoryFilters.addEventListener('click', e => {
                        const btn = e.target.closest('button');
                        if (!btn) return;
                        
                        if (btn === elements.allCategoriesBtn) {
                            state.currentCategory = 'all';
                        } else if (btn.dataset.category) {
                            state.currentCategory = btn.dataset.category;
                        }
                        
                        updateCategoryButtonStyles();
                        tagManager.applyFilters();
                    });

                    // 人工分类（一级 / 二级）筛选事件
                    elements.l1Filters.addEventListener('click', e => {
                        const btn = e.target.closest('button');
                        if (!btn || !btn.dataset.l1) return;
                        state.currentL1 = btn.dataset.l1;
                        state.currentL2 = 'all';
                        updateL1ButtonStyles();
                        buildL2Row();
                        tagManager.applyFilters();
                    });

                    elements.l2Filters.addEventListener('click', e => {
                        const btn = e.target.closest('button');
                        if (!btn || !btn.dataset.l2) return;
                        state.currentL2 = btn.dataset.l2;
                        updateL2ButtonStyles();
                        tagManager.applyFilters();
                    });

                    // 统计按钮事件
                    elements.statsButtonsContainer.addEventListener('click', e => {
                        const btn = e.target.closest('.stat-button');
                        if (!btn) return;

                        const category = btn.dataset.category;
                        state.currentCategory = category;
                        
                        updateCategoryButtonStyles();
                        tagManager.applyFilters();
                    });
                    
                    // 格式化按钮事件
                    elements.formatControls.addEventListener('click', e => {
                        const btn = e.target.closest('.format-btn');
                        if (!btn) return;
                        
                        state.currentFormat = btn.dataset.format;
                        updateFormatButtonStyles();
                        formatter.updateFormattedOutput();
                    });
                    
                    // 按钮事件
                    elements.loadUrlBtn.addEventListener('click', () => {
                        const url = elements.csvUrlInput.value.trim() || DEFAULT_URL;
                        dataLoader.loadFile(url);
                    });                     
                    
                    elements.localFileBtn.addEventListener('change', (e) => {
                        if (e.target.files.length > 0) {
                            // 直接加载选中的文件
                            dataLoader.loadFile(e.target.files[0]);
                            // 修复：重置文件输入，允许再次选择同一文件
                            e.target.value = '';
                        }
                    });
                    
                    elements.resetUrlBtn.addEventListener('click', () => {
                        elements.csvUrlInput.value = DEFAULT_URL;
                    });
                    
                    // 更新CSV：从 GitHub 拉取最新数据，页面立即使用，并自动下载以供覆盖本地文件
                    elements.updateCsvBtn.addEventListener('click', () => {
                        elements.csvUrlInput.value = REMOTE_URL;
                        // 展开加载区，便于查看下载/解析进度与结果
                        elements.loadAreaCard.classList.remove('hidden');
                        dataLoader.loadFile(REMOTE_URL, { label: '网络最新数据', downloadAs: 'tagsd_danbooru_zh.csv' });
                    });
                    
                    elements.toggleLangBtn.addEventListener('click', () => {
                        state.selectedTagsLanguage = state.selectedTagsLanguage === 'cn' ? 'en' : 'cn';
                        tagRenderer.renderSelectedTags();
                    });
                    
                    elements.clearSelectedBtn.addEventListener('click', tagManager.clearSelectedTags);
                    elements.copyTextBtn.addEventListener('click', formatter.copyToClipboard);
                    elements.saveWildcardBtn.addEventListener('click', formatter.saveAsWildcard);
                    
                    elements.reloadAppBtn.addEventListener('click', () => {
                        // 重置应用
                        state = {
                            allTags: [],
                            filteredTags: [],
                            selectedTags: [],
                            currentPage: 1,
                            currentCategory: 'all',
                            currentL1: 'all',
                            currentL2: 'all',
                            currentFormat: 'space-underscore',
                            selectedTagsLanguage: 'cn',
                            categoryCounts: {
                                '0': 0,
                                '1': 0,
                                '3': 0,
                                '4': 0,
                                '5': 0,
                                '6': 0
                            },
                            tooltipTimeout: null
                        };
                        
                        elements.selectedCount.textContent = '0';
                        elements.formattedOutput.value = '';
                        elements.searchBox.value = '';
                        elements.tagList.innerHTML = '';
                        elements.paginationControls.innerHTML = '';
                        elements.selectedTagsContainer.innerHTML = '';
                        
                        // 更新统计区域、更新统计区域
                        updateCategoryButtonStyles();
                        utils.updateStats();
                        tagDetails.update();
                        
                        // 显示加载区
                        elements.loadAreaCard.classList.remove('hidden');
                        elements.progressBar.style.width = '0%';
                        elements.statusMessage.textContent = '准备加载数据...';
                        
                        // 隐藏重新加载按钮
                        elements.reloadAppBtn.classList.add('hidden');
                        
                        dataLoader.loadDefault();
                    });
                    
                    // 分页事件
                    elements.paginationControls.addEventListener('click', e => {
                        const btn = e.target.closest('.pagination-btn');
                        if (!btn || btn.disabled) return;
                        
                        state.currentPage = Number(btn.dataset.page);
                        tagRenderer.renderTagList();
                    });
                    
                    // 头部滚动时加深投影
                    const headerEl = document.querySelector('header');
                    const onScroll = () => {
                        if (!headerEl) return;
                        if (window.scrollY > 8) headerEl.classList.add('scrolled');
                        else headerEl.classList.remove('scrolled');
                    };
                    window.addEventListener('scroll', onScroll, { passive: true });
                    onScroll();
                    
                    // 初始选择默认按钮
                    updateFormatButtonStyles();
                    updateCategoryButtonStyles();
                    
                    // 鼠标移动时更新提示位置
                    document.addEventListener('mousemove', (e) => {
                        if (elements.tagTooltip.style.opacity === '1') {
                            utils.showTooltip(elements.tagTooltip.textContent, e.clientX, e.clientY);
                        }
                    });
                    
                    dataLoader.loadDefault();
                }
            };
            
            // 公开方法
            return {
                init: () => {
                    eventHandler.init();
                }
            };
        })();
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            TagAssistant.init();
        });
    </script>
    <!-- ==================== 出图工作台脚本（TagSDanbooru × ComfyUI） ==================== -->
    <script>
    (function () {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const E = {
            dot: $('wb-dot'), status: $('wb-status'), refresh: $('wb-refresh'),
            positive: $('wb-positive'), negative: $('wb-negative'),
            fillTags: $('wb-fill-tags'), fillOutput: $('wb-fill-output'), fillBase: $('wb-fill-base'),
            model: $('wb-model'), sampler: $('wb-sampler'), scheduler: $('wb-scheduler'),
            steps: $('wb-steps'), cfg: $('wb-cfg'), width: $('wb-width'), height: $('wb-height'),
            count: $('wb-count'), seed: $('wb-seed'), seedStride: $('wb-seed-stride'), dice: $('wb-dice'), series: $('wb-series'),
            generate: $('wb-generate'), interrupt: $('wb-interrupt'), clear: $('wb-clear'), free: $('wb-free'),
            shutdown: $('wb-shutdown'),
            progress: $('wb-progress'), progressText: $('wb-progress-text'), runInfo: $('wb-run-info'),
            gallery: $('wb-gallery'), galleryInfo: $('wb-gallery-info'),
            seriesbar: $('wb-seriesbar'), runbar: $('wb-runbar'),
            openDir: $('wb-open-dir'), delRun: $('wb-del-run'), reload: $('wb-reload'),
            lightbox: $('wb-lightbox'), lightboxImg: $('wb-lightbox-img'),
            lightboxCap: $('wb-lightbox-cap'), lightboxPrev: $('wb-lightbox-prev'),
            lightboxNext: $('wb-lightbox-next'), lightboxClose: $('wb-lightbox-close')
        };
        if (!E.gallery) return;

        let pollTimer = null, busy = false, defaults = null, wfDefaultsApplied = false, connOk = false;

        const api = {
            get: async (url) => {
                const r = await fetch(url, { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            },
            post: async (url, body) => {
